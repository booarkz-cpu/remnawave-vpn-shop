name: production-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pytest pip-audit
      - run: python -m compileall -q backend
      - run: pytest -q
      - run: bash -n install.sh deploy/*.sh scripts/*.sh
      - run: pip-audit -r backend/requirements.txt
      - name: Validate Docker Compose configuration
        run: |
          cat > .env <<'EOF'
          APP_SECRET=ci-only-secret-at-least-32-characters-long
          DB_PASSWORD=ci-db-password
          API_DOMAIN=api.example.test
          ADMIN_DOMAIN=admin.example.test
          APP_DOMAIN=app.example.test
          EOF
          docker compose config
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, miniapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package.json
      - working-directory: ${{ matrix.app }}
        run: npm install --ignore-scripts
      - working-directory: ${{ matrix.app }}
        run: npm run build
      - working-directory: ${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
