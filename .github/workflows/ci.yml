name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f backend/requirements.txt ] && pip install -r backend/requirements.txt || true
          [ -f backend/requirements-dev.txt ] && pip install -r backend/requirements-dev.txt || true
          pip install ruff mypy pytest pytest-cov
      - name: Ruff
        run: ruff check backend || true
      - name: Mypy
        run: mypy backend --ignore-missing-imports || true
      - name: Pytest
        run: |
          if [ -d backend/tests ] || [ -d tests ]; then
            pytest -q || true
          else
            echo "No tests found"
          fi

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [admin, miniapp]
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json
        id: check
        run: |
          if [ -f ${{ matrix.dir }}/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci || npm install
          npm run lint --if-present
          npm run build --if-present

  docker-build:
  name: Docker build
  runs-on: ubuntu-latest
  needs: [backend]
  steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3

    - name: Create dummy .env for validation
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        elif [ -f env.example ]; then
          cp env.example .env
        else
          touch .env
        fi
        echo "Dummy .env created"

    - name: Validate compose
      run: docker compose config -q

    - name: Build
      run: docker compose build --parallel || docker compose build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  secrets-check:
    name: Secrets leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check .env
        run: |
          if git ls-files | grep -E "^\.env$|/\.env$" | grep -v ".env.example"; then
            echo "::error::.env попал в репозиторий!"
            exit 1
          fi
          echo "OK"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
