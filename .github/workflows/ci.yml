name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f backend/requirements.txt ] && pip install -r backend/requirements.txt || true
          [ -f backend/requirements-dev.txt ] && pip install -r backend/requirements-dev.txt || true
          pip install ruff mypy pytest pytest-cov
      - name: Ruff
        run: ruff check backend || true
      - name: Mypy
        run: mypy backend --ignore-missing-imports || true
      - name: Pytest
        run: |
          if [ -d backend/tests ] || [ -d tests ]; then
            pytest -q || true
          else
            echo "No tests found"
          fi

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [admin, miniapp]
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json
        id: check
        run: |
          if [ -f ${{ matrix.dir }}/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci || npm install
          npm run lint --if-present
          npm run build --if-present

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Create dummy .env for validation
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Гарантируем наличие всех переменных, которые может требовать docker-compose.yml
          cat >> .env << 'ENVEOF'

          # --- Значения для CI (заглушки, не для production) ---
          ADMIN_DOMAIN=localhost
          APP_DOMAIN=localhost
          API_DOMAIN=localhost
          MINIAPP_DOMAIN=localhost
          BOT_DOMAIN=localhost
          WEBHOOK_DOMAIN=localhost
          PANEL_DOMAIN=localhost
          CADDY_EMAIL=admin@example.com
          CADDY_HTTP_PORT=80
          CADDY_HTTPS_PORT=443

          BOT_TOKEN=0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          BOT_USERNAME=ci_test_bot

          REMNAWAVE_URL=http://localhost:3000
          REMNAWAVE_TOKEN=ci_test_token

          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=ci_test_password
          APP_SECRET=ci_test_secret_key_0123456789abcdef

          DB_USER=remna
          DB_PASSWORD=ci_test_db_password
          DB_NAME=remna_shop
          POSTGRES_USER=remna
          POSTGRES_PASSWORD=ci_test_db_password
          POSTGRES_DB=remna_shop
          DATABASE_URL=postgresql://remna:ci_test_db_password@localhost:5432/remna_shop

          REDIS_PASSWORD=ci_test_redis
          ENVEOF

          echo "=== .env готов, первые строки: ==="
          head -30 .env

      - name: Validate compose
        run: docker compose config -q

      - name: Build
        run: docker compose build --parallel || docker compose build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  secrets-check:
    name: Secrets leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check .env
        run: |
          if git ls-files | grep -E "^\.env$|/\.env$" | grep -v ".env.example"; then
            echo "::error::.env попал в репозиторий!"
            exit 1
          fi
          echo "OK"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
